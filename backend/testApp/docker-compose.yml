services:
  db:
    image: postgis/postgis:13-3.3 
    restart: always  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pet_db"]
      interval: 5s
      timeout: 3s
      retries: 5               
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pet_db      
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" 
    networks:
      - pet-network

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pet-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:admin@db:5432/pet_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy 
      redis:
        condition: service_started
    networks:
      - pet-network
    volumes:
      - .:/app
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - pet-network

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    # environment:
    #   - REDIS_PASSWORD=admin
    volumes:
      - redis_data:/data
    networks:
      - pet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    depends_on: 
      - redis
    restart: always
    volumes:
      - redis_insight_data:/data
    ports: 
      - "5540:5540"
    networks: 
      - pet-network

  # notifications-db:
  #   image: postgres:13
  #   environment:
  #     POSTGRES_DB: notifications
  #     POSTGRES_USER: notif_user
  #     POSTGRES_PASSWORD: notif_pass
